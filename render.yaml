services:
  - type: web
    name: trace-backend
    runtime: docker
    plan: free
    rootDir: backend-go
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: PGVECTOR_TABLE
        value: trace_vectors_cf_384
      - key: GROQ_FAST_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_CHAT_MODELS
        value: llama-3.3-70b-versatile,llama-3.1-8b-instant,openai/gpt-oss-20b,openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: GROQ_MAX_TOKENS
        value: "1024"
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
