
spring.application.name=devPilot
server.port=${PORT:8080}

# Render terminates HTTPS at its proxy.
server.forward-headers-strategy=framework

# PostgreSQL - Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Groq chat through its OpenAI-compatible endpoint
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
app.groq.chat.models=${GROQ_CHAT_MODELS:openai/gpt-oss-20b,llama-3.3-70b-versatile,openai/gpt-oss-120b}
app.groq.reasoning-effort=${GROQ_REASONING_EFFORT:low}
app.groq.max-tokens=${GROQ_MAX_TOKENS:1024}

# Last-resort chat generation uses Gemini
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash

# Embedding provider selection - use 'cloudflare' for Cloudflare Workers AI or 'nvidia' for rollback
embedding.provider=cloudflare

# Cloudflare Workers AI embeddings for repository indexing and semantic search
# bge-small-en-v1.5: 384 dimensions, 33M params, optimized for speed
# Note: CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are read directly from environment variables
# via Environment injection in CloudflareEmbeddingService to avoid circular placeholder reference
# Model: @cf/baai/bge-small-en-v1.5

# NVIDIA embeddings fallback (keep for rollback, not used when EMBEDDING_PROVIDER=cloudflare)
# spring.ai.model.embedding=openai
# spring.ai.openai.embedding.base-url=https://integrate.api.nvidia.com/v1
# spring.ai.openai.embedding.api-key=${NVIDIA_API_KEY}
# spring.ai.openai.embedding.model=nvidia/nemotron-3.5-embed-1b
# spring.ai.openai.embedding.dimensions=768

# NVIDIA embeddings remain available when EMBEDDING_PROVIDER=nvidia.

# GitHub API access is optional; public repositories also work without a token.
github.token=${GITHUB_TOKEN:}

# CORS and frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Database and PGVector
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
# Exclude embedding and vector store auto-configuration; explicit provider beans are used.
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

spring.main.lazy-initialization=false
spring.jpa.open-in-view=false
spring.threads.virtual.enabled=true

# HTTP compression for JSON responses (excludes text/event-stream so SSE stays unbuffered)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,application/javascript,text/css
server.compression.min-response-size=1024

spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

spring.ai.vectorstore.pgvector.table-name=devpilot_vectors_cf_384
spring.ai.vectorstore.pgvector.dimensions=384

management.endpoints.web.exposure.include=health,info
